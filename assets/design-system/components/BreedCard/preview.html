<!-- @dsCard group="Cards" height=520 subtitle="품종 · 개체" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>.fc-b{transition:transform .35s cubic-bezier(.2,.7,.2,1);transform-origin:center bottom}.fc-b:hover{transform:scale(1.045)}.fc-i{transition:background-color .25s ease}.fc-i:hover{background:var(--hover-tint)}</style>
<div style="font-family: var(--font-sans); display: flex; gap: 32px; align-items: flex-start; padding: 24px; background: var(--white)">
  <button class="fc-b" type="button" style="width: 336px; border: 0; padding: 0 0 20px; background: var(--white); text-align: left; font: inherit; display: flex; flex-direction: column; gap: 18px; cursor: pointer">
    <div style="width: 100%; height: 300px; background: var(--photo-ground); display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.1em; color: var(--text-muted)">IMG · 하프문</div>
    <span style="padding: 0 4px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: var(--navy-900)">하프문</span>
  </button>
  <button class="fc-i" type="button" style="width: 306px; border: 0; padding: 12px 12px 24px; background: transparent; text-align: left; font: inherit; display: flex; flex-direction: column; gap: 8px; cursor: pointer">
    <div style="position: relative; height: 400px; background: var(--photo-ground); display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.1em; color: var(--text-muted)">IMG · 세로 3:4<span style="position: absolute; left: 14px; top: 14px; padding: 3px 10px; background: var(--white); font-size: 10.5px; letter-spacing: 0.14em; color: var(--text)">BLUE</span></div>
    <span style="margin-top: 8px; font-size: 16px; font-weight: 600; color: var(--navy-900)">하프문 · 로열 블루</span>
    <span style="font-size: 13.5px; line-height: 1.6; color: var(--text-muted)">하프문 · 로열 블루 솔리드 · 수컷</span>
  </button>
</div>
