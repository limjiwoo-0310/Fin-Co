<!-- @dsCard group="Inputs" height=120 subtitle="색·패턴별 찾기" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<div role="group" aria-label="색·패턴별 찾기" style="font-family: var(--font-sans); display: flex; gap: 8px; flex-wrap: wrap; padding: 24px">
  <button type="button" aria-pressed="true" style="height: 40px; padding: 0 20px; border: 1px solid var(--navy-900); background: var(--navy-900); color: var(--white); font: inherit; font-size: 14px; font-weight: 500">전체</button>
  <button type="button" aria-pressed="false" style="height: 40px; padding: 0 20px; border: 1px solid var(--line-control); background: var(--white); color: var(--text); font: inherit; font-size: 14px">블루</button>
  <button type="button" aria-pressed="false" style="height: 40px; padding: 0 20px; border: 1px solid var(--line-control); background: var(--white); color: var(--text); font: inherit; font-size: 14px">레드</button>
  <button type="button" aria-pressed="false" style="height: 40px; padding: 0 20px; border: 1px solid var(--line-control); background: var(--white); color: var(--text); font: inherit; font-size: 14px">화이트·파스텔</button>
  <button type="button" aria-pressed="false" style="height: 40px; padding: 0 20px; border: 1px solid var(--line-control); background: var(--white); color: var(--text); font: inherit; font-size: 14px">멀티컬러</button>
</div>
