<!-- @dsCard group="Content" height=280 subtitle="적정 환경 · 하프문 예시" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<div style="font-family: var(--font-sans); padding: 24px; display: flex; gap: 24px; flex-wrap: wrap">
  <dl style="margin: 0; width: 360px; display: grid; grid-template-columns: 88px 1fr; row-gap: 14px; column-gap: 16px; font-size: 15px; line-height: 1.6; color: var(--text)">
    <dt style="font-weight: 600; color: var(--ink)">수온</dt><dd style="margin: 0">24~28℃ · 히터 사용 권장</dd>
    <dt style="font-weight: 600; color: var(--ink)">어항</dt><dd style="margin: 0">10L 이상 권장</dd>
    <dt style="font-weight: 600; color: var(--ink)">여과기</dt><dd style="margin: 0">물살이 약한 스펀지 여과기</dd>
    <dt style="font-weight: 600; color: var(--ink)">합사</dt><dd style="margin: 0">수컷은 한 어항에 한 마리</dd>
  </dl>
  <div style="width: 360px; background: var(--mist); padding: 24px 28px; display: grid; grid-template-columns: 88px 1fr; row-gap: 10px; column-gap: 16px; font-size: 15px; line-height: 1.6; color: var(--text); box-sizing: border-box">
    <span style="font-weight: 600; color: var(--ink)">키우기 난이도</span><span>보통</span>
    <span style="font-weight: 600; color: var(--ink)">환경 요약</span><span>수온 24~28℃ · 어항 10L 이상 · 물살이 약한 환경에서 키우세요.</span>
  </div>
</div>
